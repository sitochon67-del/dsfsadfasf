<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview: PSE Loading Screen</title>
    <link rel="stylesheet" href="PseLoading.css">
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body class="pse-loading-active">
    <div class="pse-container">
        <header class="pse-header">
            <div class="pse-header-content">
                <div class="pse-logo-left">
                    <img src="img/NFbanner-izq-pse.png" alt="PSE Logo" />
                </div>
                <div class="pse-logo-right">
                    <img src="img/NFbanner-der-pse.png" alt="Fácil, rápido y seguro" />
                </div>
            </div>
        </header>

        <main class="pse-main">
            <div class="processing-box">
                <h2 class="processing-text">Estamos procesando tu transacción...</h2>
                <div class="loader-wrapper">
                    <div class="pse-loader-gif" style="--pse-loader-size: 175px">
                        <img src="img/procesando.gif" alt="Procesando" class="pse-loader-gif__img" width="175" height="175" />
                    </div>
                </div>
            </div>
        </main>

        <footer class="pse-footer">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="img/footer-pse.svg" alt="ACH Colombia" />
                </div>
                <div class="contact-bar-wrapper">
                    <div class="accent-bar"></div>
                    <div class="contact-bar">
                        <div class="contact-col persona-icon">
                            <img src="img/footerPersona-pse.svg" alt="Persona" />
                        </div>
                        <div class="contact-col info-text">
                            <span class="info-label">Para mayor información</span>
                            <span class="info-sublabel">comunícate con nosotros:</span>
                        </div>
                        <div class="contact-col contact-methods">
                            <div class="method">
                                <img src="img/mobile-pse.svg" alt="Phone" class="method-icon" />
                                <span>En Bogotá:</span>
                            </div>
                            <div class="method">
                                <img src="img/contanw-pse.svg" alt="Website" class="method-icon" />
                                <span>Escríbenos:</span>
                            </div>
                        </div>
                        <div class="contact-col contact-details">
                            <div class="detail">+57 (601) 3808890 opción 5</div>
                            <div class="detail">
                                <a href="https://www.pse.com.co/persona-centro-de-ayuda" target="_blank" rel="noopener noreferrer">
                                    www.pse.com.co/persona-centro-de-ayuda
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
